<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>AdminBuddy - Tu Dashboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>
    <body class="bg-light">
        <div class="dashboard-container">
            <header>
                <h1>Mi resumen financiero</h1>
            </header>

            <div class="stats-grid">
                <div class="card status-saldo">
                <h3>Saldo Actual</h3>
                <p class="amount">${{ resumen.saldo }}</p>
                </div>
                <div class="card status-ingreso">
                <h3>Ingresos</h3>
                <p class="amount text-success">+ ${{ resumen.ingresos}}</p>
                </div>
                <div class="card status-gasto">
                <h3>Gastos</h3>
                <p class="amount text-danger">- ${{ resumen.gastos}}</p>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary">Nueva Transacción</button>
        </div>
    </body>
</html>
